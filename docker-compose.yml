services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: cocos
      POSTGRES_PASSWORD: cocos
      POSTGRES_DB: cocos
    ports:
      - "5433:5432"
    volumes:
      # Postgres ejecuta este archivo una sola vez, al crear la base.
      - ./db/init/database.sql:/docker-entrypoint-initdb.d/01_database.sql:ro
      - cocos_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cocos -d cocos"]
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    build: .
    profiles: ["api"]
    environment:
      DATABASE_URL: postgres://cocos:cocos@db:5432/cocos
      PORT: "3000"
      HOST: 0.0.0.0
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "node scripts/migrate.ts && node src/server.ts"

volumes:
  cocos_pgdata:
